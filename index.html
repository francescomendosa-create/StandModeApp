<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>StandMode</title>
  <link rel="stylesheet" href="css/styles.css?v=1.0.3" />
  <link rel="manifest" href="manifest.webmanifest?v=1.0.3" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    /* Sblocca SW/cache vecchi una volta (come TagImpianto). */
    (function () {
      var V = "1.0.3";
      var flag = "sm-sw-purge-" + V;
      if (sessionStorage.getItem(flag)) return;
      if (!("serviceWorker" in navigator)) return;
      sessionStorage.setItem(flag, "1");
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        if (!window.caches) return;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <div class="install-bar" id="installBar">
    <button type="button" class="install-btn" id="btnInstall">Installa app</button>
    <p class="install-hint" id="installHint" hidden></p>
  </div>

  <div class="zoom-menu" id="zoomMenu" hidden>
    <button type="button" class="adj-btn" id="zoomIn" aria-label="Ingrandisci">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10.5 7.6 V13.4 M7.6 10.5 H13.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="adj-btn" id="zoomOut" aria-label="Riduci">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7.6 10.5 H13.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="nudge-menu nudge-menu-ud" id="nudgeMenu" hidden>
    <button type="button" class="adj-btn" id="nudgeUp" aria-label="Sposta su">▲</button>
    <button type="button" class="adj-btn" id="nudgeDown" aria-label="Sposta giù">▼</button>
  </div>

  <div class="nudge-menu nudge-menu-lr" id="nudgeMenuLR" hidden>
    <button type="button" class="adj-btn" id="nudgeLeft" aria-label="Sposta sinistra">◀</button>
    <button type="button" class="adj-btn" id="nudgeRight" aria-label="Sposta destra">▶</button>
  </div>

  <div class="color-menu" id="colorMenu" hidden aria-label="Colori">
    <div class="color-tabs" id="colorTabs"></div>
    <div class="color-dots" id="colorDots"></div>
  </div>

  <main class="stand" id="stand" aria-label="StandMode">
    <section class="panel clock-panel" data-part="clock" aria-label="Orologio">
      <div class="part-inner">
        <div class="clock" id="clock">
          <svg class="clock-face" viewBox="0 0 200 200" aria-hidden="true">
            <rect class="clock-bg" x="0" y="0" width="200" height="200" rx="42" ry="42" />
            <g class="ticks" id="ticks"></g>
            <g class="nums" id="nums"></g>
            <g class="hands">
              <g id="hourHand">
                <rect class="hand-hour" x="95.5" y="52" width="9" height="56" rx="4.5" />
              </g>
              <g id="minuteHand">
                <rect class="hand-minute" x="95.5" y="30" width="9" height="78" rx="4.5" />
              </g>
              <g id="secondHand">
                <line class="hand-second" x1="100" y1="124" x2="100" y2="24" stroke-width="2" stroke-linecap="round" />
              </g>
              <circle class="hub-outer" cx="100" cy="100" r="5.8" />
              <circle class="hub-inner" cx="100" cy="100" r="2.3" />
            </g>
          </svg>
        </div>
      </div>
    </section>

    <section class="panel date-panel" data-part="date" aria-label="Data">
      <div class="part-inner">
        <div class="date-top">
          <span class="date-weekday" id="weekday">Lun</span>
          <span class="date-month-short" id="monthShort">Nov</span>
        </div>
        <div class="date-day" id="dayNum">2</div>
      </div>
    </section>

    <section class="panel cal-panel" data-part="cal" aria-label="Calendario">
      <div class="part-inner">
        <div class="cal" id="calendar">
          <div class="cal-title" id="calTitle">NOVEMBRE</div>
          <div class="cal-weekdays" id="calWeekdays"></div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
