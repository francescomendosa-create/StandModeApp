<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>StandMode</title>
  <link rel="stylesheet" href="css/styles.css?v=1.1.0" />
  <link rel="manifest" href="manifest.webmanifest?v=1.1.0" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    (function () {
      var V = "1.1.0";
      var flag = "sm-sw-purge-" + V;
      if (sessionStorage.getItem(flag)) return;
      if (!("serviceWorker" in navigator)) return;
      sessionStorage.setItem(flag, "1");
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        if (!window.caches) return;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      }).catch(function () {});
    })();
  </script>
</head>
<body data-layout="classic">
  <div class="install-bar" id="installBar">
    <button type="button" class="install-btn" id="btnInstall">Installa app</button>
    <p class="install-hint" id="installHint" hidden></p>
  </div>

  <div class="widget-picker" id="widgetPicker" hidden aria-label="Widget">
    <button type="button" class="widget-thumb" data-layout="classic" aria-label="Widget classico">
      <span class="widget-thumb-preview thumb-classic" aria-hidden="true"></span>
      <span class="widget-thumb-label">Classico</span>
    </button>
    <button type="button" class="widget-thumb" data-layout="aura" aria-label="Widget Aura">
      <span class="widget-thumb-preview thumb-aura" aria-hidden="true"></span>
      <span class="widget-thumb-label">Aura</span>
    </button>
  </div>

  <div class="zoom-menu" id="zoomMenu" hidden>
    <button type="button" class="adj-btn" id="zoomIn" aria-label="Ingrandisci">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10.5 7.6 V13.4 M7.6 10.5 H13.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="adj-btn" id="zoomOut" aria-label="Riduci">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.2 15.2 L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7.6 10.5 H13.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="nudge-menu nudge-menu-ud" id="nudgeMenu" hidden>
    <button type="button" class="adj-btn" id="nudgeUp" aria-label="Sposta su">▲</button>
    <button type="button" class="adj-btn" id="nudgeDown" aria-label="Sposta giù">▼</button>
  </div>

  <div class="nudge-menu nudge-menu-lr" id="nudgeMenuLR" hidden>
    <button type="button" class="adj-btn" id="nudgeLeft" aria-label="Sposta sinistra">◀</button>
    <button type="button" class="adj-btn" id="nudgeRight" aria-label="Sposta destra">▶</button>
  </div>

  <div class="color-menu" id="colorMenu" hidden aria-label="Colori">
    <div class="color-tabs" id="colorTabs"></div>
    <div class="color-dots" id="colorDots"></div>
  </div>

  <main class="stand" id="stand" aria-label="StandMode">
    <!-- Layout 1: classico -->
    <div class="layout layout-classic" id="layoutClassic">
      <section class="panel clock-panel" data-part="clock" aria-label="Orologio">
        <div class="part-inner">
          <div class="clock">
            <svg class="clock-face" viewBox="0 0 200 200" aria-hidden="true" data-clock="classic">
              <rect class="clock-bg" x="0" y="0" width="200" height="200" rx="42" ry="42" />
              <g class="ticks"></g>
              <g class="nums"></g>
              <g class="hands">
                <g class="hour-hand"><rect class="hand-hour" x="95.5" y="52" width="9" height="56" rx="4.5" /></g>
                <g class="minute-hand"><rect class="hand-minute" x="95.5" y="30" width="9" height="78" rx="4.5" /></g>
                <g class="second-hand"><line class="hand-second" x1="100" y1="124" x2="100" y2="24" stroke-width="2" stroke-linecap="round" /></g>
                <circle class="hub-outer" cx="100" cy="100" r="5.8" />
                <circle class="hub-inner" cx="100" cy="100" r="2.3" />
              </g>
            </svg>
          </div>
        </div>
      </section>

      <section class="panel date-panel" data-part="date" aria-label="Data">
        <div class="part-inner">
          <div class="date-top">
            <span class="date-weekday" data-role="weekday">Lun</span>
            <span class="date-month-short" data-role="monthShort">Nov</span>
          </div>
          <div class="date-day" data-role="dayNum">2</div>
        </div>
      </section>

      <section class="panel cal-panel" data-part="cal" aria-label="Calendario">
        <div class="part-inner">
          <div class="cal">
            <div class="cal-title" data-role="calTitle">NOVEMBRE</div>
            <div class="cal-weekdays" data-role="calWeekdays"></div>
            <div class="cal-grid" data-role="calGrid"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Layout 2: Aura (orologio + meteo + calendario) -->
    <div class="layout layout-aura" id="layoutAura" hidden>
      <section class="panel weather-panel" data-part="weather" aria-label="Meteo">
        <div class="part-inner weather-card">
          <div class="weather-icon" id="weatherIcon" aria-hidden="true"></div>
          <div class="weather-temp"><span id="weatherTemp">--</span><span class="weather-unit">°</span></div>
          <div class="weather-desc" id="weatherDesc">Meteo</div>
          <div class="weather-meta" id="weatherMeta"></div>
        </div>
      </section>

      <section class="panel cal-panel aura-cal" data-part="cal" aria-label="Calendario">
        <div class="part-inner">
          <div class="cal">
            <div class="cal-title" data-role="calTitle">NOVEMBRE</div>
            <div class="cal-weekdays" data-role="calWeekdays"></div>
            <div class="cal-grid" data-role="calGrid"></div>
          </div>
        </div>
      </section>

      <section class="panel clock-panel aura-clock" data-part="clock" aria-label="Orologio">
        <div class="part-inner">
          <div class="clock clock-aura">
            <svg class="clock-face" viewBox="0 0 200 200" aria-hidden="true" data-clock="aura">
              <rect class="clock-bg" x="0" y="0" width="200" height="200" rx="46" ry="46" />
              <g class="ticks"></g>
              <g class="nums"></g>
              <g class="hands">
                <g class="hour-hand"><rect class="hand-hour" x="95" y="48" width="10" height="62" rx="5" /></g>
                <g class="minute-hand"><rect class="hand-minute" x="95" y="28" width="10" height="82" rx="5" /></g>
                <g class="second-hand"><line class="hand-second" x1="100" y1="128" x2="100" y2="22" stroke-width="2.2" stroke-linecap="round" /></g>
                <circle class="hub-outer" cx="100" cy="100" r="6.2" />
                <circle class="hub-inner" cx="100" cy="100" r="2.4" />
              </g>
            </svg>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="js/app.js?v=1.1.0"></script>
</body>
</html>
